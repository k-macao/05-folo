name: firmware

# 在 GitHub 的 runner 上编译固件并产出合并镜像（本仓库的本地沙箱既没有 ESP-IDF 工具链，
# 也没有 USB 直通，所以镜像在这里产出、烧录在你自己的电脑上做）。
#
# 产物：005-signal-log-full.bin —— 从 0x0 起的合并镜像，可直接用 esptool 写入，
# 或者 ./tools/flash.sh 一键完成。
#
# 构建日志：正常时在 Actions 页面；失败时会把最后 120 行贴到本次提交的提交评论里
# （Actions 日志下载域名在部分网络下不可达，提交评论走 api.github.com，能稳定读到）。
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "main/**"
      - "components/**"
      - "sdkconfig.defaults"
      - "partitions.csv"
      - "CMakeLists.txt"
      - ".github/workflows/firmware.yml"

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build and merge image (ESP-IDF 5.5.3)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32c3
          command: >-
            idf.py build 2>&1 | tee /tmp/build.log ;
            test ${PIPESTATUS[0]} -eq 0 &&
            idf.py merge-bin -o build/005-signal-log-full.bin 2>&1 | tee -a /tmp/build.log &&
            idf.py size 2>&1 | tee -a /tmp/build.log

      - name: Checksums and sizes
        run: |
          ls -l build/*.bin
          sha256sum build/005-signal-log-full.bin | tee build/SHA256SUMS.txt

      - name: Upload merged image
        uses: actions/upload-artifact@v4
        with:
          name: 005-signal-log-full
          path: |
            build/005-signal-log-full.bin
            build/SHA256SUMS.txt
          retention-days: 30

      - name: Publish build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== last 120 lines of the build ==="
          tail -n 120 /tmp/build.log 2>/dev/null || echo "(no /tmp/build.log)"
          body_file=$(mktemp)
          {
            echo '```'
            tail -n 120 /tmp/build.log 2>/dev/null || echo "(no /tmp/build.log)"
            echo '```'
          } > "$body_file"
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
             -f body="$(cat "$body_file")" --jq '.html_url' || echo "commit comment failed"
