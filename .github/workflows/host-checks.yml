name: host-check

# 固件本身需要 ESP-IDF 5.5.3，这里只跑不需要工具链的部分：
# 纯逻辑单测、feed 解析单测、feed 生成器校验、字体码点覆盖、预览冒烟测试。
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install host deps
        run: pip install pillow

      - name: Host tests (gcc)
        run: ./tools/check.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Preview smoke test (jsdom)
        run: |
          npm install --no-save jsdom
          node tests/preview-smoke.mjs
